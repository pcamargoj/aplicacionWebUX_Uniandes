<ol class="stepper" aria-label="Pasos para agregar la recurrencia">
  @for (label of steps(); track label; let i = $index) {
    @let step = i + 1;
    <li
      class="stepper__step"
      [class.stepper__step--complete]="step < current()"
      [class.stepper__step--active]="step === current()"
      [class.stepper__step--pending]="step > current()"
      [attr.aria-current]="step === current() ? 'step' : null"
    >
      <span class="stepper__circle">
        @if (step < current()) {
          <mat-icon class="stepper__check" aria-hidden="true">check</mat-icon>
        } @else {
          {{ step }}
        }
      </span>
      <span class="stepper__label">{{ label }}</span>
    </li>
  }
</ol>
