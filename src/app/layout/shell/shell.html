<div class="shell">
  <aside class="shell__sidenav">
    <button mat-icon-button class="shell__menu-toggle" aria-label="Abrir menú">
      <mat-icon>menu</mat-icon>
    </button>

    <button mat-fab class="shell__fab" aria-label="Crear">
      <mat-icon>add</mat-icon>
    </button>

    <nav class="shell__nav" aria-label="Navegación principal">
      @for (item of navItems; track item.route) {
        @if (item.implemented) {
          <a
            class="shell__nav-item"
            [routerLink]="item.route"
            routerLinkActive="shell__nav-item--active"
            [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        } @else {
          <button type="button" class="shell__nav-item" disabled>
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </button>
        }
      }
    </nav>
  </aside>

  <div class="shell__content">
    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
</div>
