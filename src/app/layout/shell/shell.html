<div class="shell">
  <aside class="shell__sidenav">
    <button mat-icon-button class="shell__menu-toggle" aria-label="Abrir menú">
      <mat-icon>menu</mat-icon>
    </button>

    <button mat-fab class="shell__fab" aria-label="Crear">
      <mat-icon>add</mat-icon>
    </button>

    <nav class="shell__nav">
      <a
        class="shell__nav-item"
        routerLink="/"
        routerLinkActive="shell__nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon>home</mat-icon>
        <span>Inicio</span>
      </a>

      @for (item of navItems.slice(1); track item.route) {
        <button type="button" class="shell__nav-item" disabled>
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </button>
      }
    </nav>
  </aside>

  <div class="shell__content">
    <main class="shell__main">
      <router-outlet />
    </main>
  </div>
</div>
